services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: ai_clone_db
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:-aiclone}
    ports:
      - "5433:5432"

  redis:
    image: redis:latest
    container_name: ai_clone_redis
    ports:
      - "6379:6379"
