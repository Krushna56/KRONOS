# Reads POSTGRES_* from your .env file (see .env.example). No secrets in git.
services:

  postgres:
    image: pgvector/pgvector:pg16
    container_name: ai_clone_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:-aiclone}
    ports:
      - "127.0.0.1:5433:5432"   # bound to localhost only
    volumes:
      - pgdata:/var/lib/postgresql/data

  redis:
    image: redis:7
    container_name: ai_clone_redis
    restart: unless-stopped
    ports:
      - "127.0.0.1:6379:6379"   # bound to localhost only
    volumes:
      - redisdata:/data

volumes:
  pgdata:
  redisdata:
