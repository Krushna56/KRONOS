name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      # Lightweight deps only: CI doesn't need torch / audio stacks.
      - name: Install
        run: |
          pip install fastapi uvicorn pydantic-settings "pydantic[email]" python-multipart \
            python-dotenv python-jose passlib "bcrypt==4.0.1" sqlalchemy asyncpg aiosqlite \
            httpx twilio loguru numpy pytest pytest-asyncio ruff

      - name: Lint (syntax errors & undefined names)
        run: ruff check app tests --select E9,F63,F7,F82 --ignore F821 --output-format github

      - name: Security & websocket regression tests
        run: python -m pytest tests/test_security_hardening.py tests/test_auth.py tests/test_websocket.py tests/test_tasks_and_orchestrator.py tests/test_connection.py -q

      # Needs a DB / audio hardware / real tokens; tracked but non-blocking for now.
      - name: Remaining tests (non-blocking)
        continue-on-error: true
        run: python -m pytest tests -q
